{% extends "blog/base.html" %} {% load crispy_forms_filters %} {% load
crispy_forms_tags %} {% block content %}
<div class="content-section">
  <form method="POST">
    {%csrf_token%}
    <fieldset class="form-group">
      <legend class="border-bottom b-4">Sign In</legend>
      {{form|crispy }}
    </fieldset>
    <div class="form-group">
      <button type="submit" class="btn btn-outline-info">Sign In</button>
      <small class="text-muted"
        ><a href="{% url 'password_reset' %}">Forgot password?</a></small
      >
    </div>
  </form>
  <div class="mt-2 border-top pt-3">
    <small class="text-muted">
      Do not have an account? <a href="{% url 'register' %}">Sign Up</a>
    </small>
  </div>
</div>
{% endblock content %}
